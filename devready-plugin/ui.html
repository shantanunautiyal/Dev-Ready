<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevReady Inspect</title>
<style>
  /* ---------- workspace: tabs, cards, lists ---------- */
  .tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); background: var(--bg); flex: 0 0 auto; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; font: inherit; font-size: 11px; font-weight: 500; color: var(--fg2); padding: 8px 8px 7px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); }
  .tab:hover { color: var(--fg); }
  .tab:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: 4px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 0 0 10px; }
  .card h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 2px 0; }
  .kv span:first-child { color: var(--fg2); }
  .meter { height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; margin: 6px 0; }
  .meter i { display: block; height: 100%; background: var(--brand); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--bg3); color: var(--fg2); }
  .pill.ok { background: var(--green-tint); color: var(--green-fg); }
  .pill.warn { background: var(--warn-tint); color: var(--warn-fg); }
  .row-line { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .row-line:last-child { border-bottom: 0; }
  .row-line .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
  .gh-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .gh-box code { font-family: var(--mono); font-size: 10px; word-break: break-all; }
  .empty-tab { color: var(--fg2); font-size: 11px; line-height: 1.5; padding: 4px 0 12px; }
  .file-pick { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 11px; }
  .file-pick input { margin: 0; }
  .diff-line { font-family: var(--mono); font-size: 10px; padding: 1px 4px; white-space: pre-wrap; }
  .diff-line.add { background: var(--green-tint); }
  .diff-line.del { background: var(--danger-tint); }

  /* ---------- Figma UI3 tokens (fallbacks used outside Figma) ---------- */
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --hover: var(--figma-color-bg-hover, #f5f5f5);
    --pressed: var(--figma-color-bg-pressed, #e6e6e6);
    --fg: var(--figma-color-text, rgba(0,0,0,.9));
    --fg2: var(--figma-color-text-secondary, rgba(0,0,0,.5));
    --fg3: var(--figma-color-text-tertiary, rgba(0,0,0,.3));
    --icon: var(--figma-color-icon-secondary, rgba(0,0,0,.5));
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-fg: var(--figma-color-text-brand, #007be5);
    --onbrand: var(--figma-color-text-onbrand, #ffffff);
    --green: var(--figma-color-bg-success, #14ae5c);
    --warn-fg: var(--figma-color-text-warning, #b86200);
    --warn-tint: var(--figma-color-bg-warning-tertiary, #fff1e3);
    --danger: var(--figma-color-text-danger, #dc3412);
    --danger-tint: var(--figma-color-bg-danger-tertiary, #ffe2e0);
    --green-fg: var(--figma-color-text-success, #009951);
    --green-tint: var(--figma-color-bg-success-tertiary, #cff7d3);
    --purple: var(--figma-color-text-component, #9747ff);
    --purple-tint: var(--figma-color-bg-component-tertiary, #f1e5ff);
    --menu: var(--figma-color-bg-menu, #1e1e1e);
    --menu-fg: var(--figma-color-text-menu, #ffffff);
    --menu-fg2: var(--figma-color-text-menu-secondary, rgba(255,255,255,.6));
    --menu-hover: var(--figma-color-bg-menu-selected, #0d99ff);
    --code-prop: #9747ff; --code-val: #0c8ce9; --code-str: #009951; --code-tag: #e03e1a; --code-cmt: rgba(0,0,0,.35);
    --mono: "Roboto Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--figma-color-bg, #2c2c2c); --bg2: var(--figma-color-bg-secondary, #383838); --bg3: var(--figma-color-bg-tertiary, #444);
      --hover: var(--figma-color-bg-hover, #383838); --pressed: var(--figma-color-bg-pressed, #444);
      --fg: var(--figma-color-text, #fff); --fg2: var(--figma-color-text-secondary, rgba(255,255,255,.7)); --fg3: var(--figma-color-text-tertiary, rgba(255,255,255,.4));
      --icon: var(--figma-color-icon-secondary, rgba(255,255,255,.7)); --border: var(--figma-color-border, #444);
      --green-fg: var(--figma-color-text-success, #79d297); --green-tint: var(--figma-color-bg-success-tertiary, #1a4a2e);
      --purple: var(--figma-color-text-component, #d6b6fb); --purple-tint: var(--figma-color-bg-component-tertiary, #3c2a5a);
      --brand-fg: var(--figma-color-text-brand, #7cc4f8);
    }
  }
  .figma-dark { --code-prop: #d6b6fb; --code-val: #7cc4f8; --code-str: #79d297; --code-tag: #ffa98e; --code-cmt: rgba(255,255,255,.4); }
  @media (prefers-color-scheme: dark) { :root:not(.figma-light) { --code-prop: #d6b6fb; --code-val: #7cc4f8; --code-str: #79d297; --code-tag: #ffa98e; --code-cmt: rgba(255,255,255,.4); } }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .005em; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  a { color: var(--brand-fg); text-decoration: none; }
  svg { display: block; flex-shrink: 0; }
  main { flex: 1; overflow-y: auto; overflow-x: hidden; }
  /* Design pads itself in .sec-h / .sec-b; the workspace tabs write straight into
     #main, so without this every one of them sits flush against the panel edge. */
  main.tabview { padding: 2px 16px 16px; }
  .offline { margin: 8px 16px 0; padding: 10px 12px; border-radius: 6px; background: color-mix(in srgb, #ffcd29 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, #ffcd29 45%, transparent); }
  .offline b { display: block; margin-bottom: 2px; }
  .offline .faint { line-height: 1.5; }
  main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 8px; border: 2px solid var(--bg); }

  /* ---------- header ---------- */
  .hdr { padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .hdr-row { display: flex; align-items: center; gap: 6px; height: 32px; }
  .hdr .ico { color: var(--icon); }
  .hdr .ico.cmp { color: var(--purple); }
  .hdr .name { font-weight: 600; font-size: 13px; line-height: 20px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .sub { color: var(--fg2); padding: 0 8px 2px 22px; margin-top: -4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--icon); flex-shrink: 0; }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .ibtn.on { background: var(--pressed); }

  .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px 0 6px; border-radius: 5px; font-weight: 500; white-space: nowrap; }
  .chip.ready { color: var(--green-fg); background: var(--green-tint); }
  .chip.done { color: var(--fg); background: var(--bg2); }
  .chip.done svg:first-child { color: var(--green); }
  .chip.none { color: var(--fg2); background: var(--bg2); }
  .chip.off { color: var(--fg2); border: 1px dashed var(--border); }
  button.chip:hover { filter: brightness(.97); }
  .chip.chg { color: var(--warn-fg); background: var(--warn-tint); cursor: pointer; }
  .crumb { display: flex; align-items: center; gap: 2px; padding: 0 8px 4px 22px; color: var(--fg2); white-space: nowrap; overflow: hidden; }
  .crumb span.c { cursor: pointer; border-radius: 3px; padding: 1px 3px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 24px; }
  .crumb span.c:hover { background: var(--hover); color: var(--fg); }
  .crumb i { font-style: normal; color: var(--fg3); }
  .kb { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; flex-shrink: 0; }
  .kb.added { color: var(--green-fg); background: var(--green-tint); }
  .kb.changed { color: var(--warn-fg); background: var(--warn-tint); }
  .kb.removed { color: var(--danger); background: var(--danger-tint); }
  .list-row.dead { cursor: default; opacity: .7; }
  .list-row.dead:hover { background: none; }
  .list-row .x { opacity: 0; color: var(--fg2); }
  .list-row:hover .x, .note:hover .x { opacity: 1; }
  .note .x { margin-left: auto; opacity: 0; color: var(--fg2); align-self: flex-start; }
  /* accessibility + tokens */
  .a-sum { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .a-sum .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px; font-weight: 500; background: var(--bg2); color: var(--fg2); }
  .a-sum .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .a-sum .pill.bad { background: var(--danger-tint); color: var(--danger); }
  .a-sum .pill.warn { background: var(--warn-tint); color: var(--warn-fg); }
  .a-sum .pill.ok { background: var(--green-tint); color: var(--green-fg); }
  .a-row { height: auto; min-height: 32px; padding-top: 3px; padding-bottom: 3px; }
  .a-count { flex-shrink: 0; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--bg3); color: var(--fg2); font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; margin-right: 6px; }
  .a-row .ln { display: flex; flex-direction: column; min-width: 0; line-height: 15px; }
  .a-row .ln small { color: var(--fg2); font-size: 11px; white-space: normal; }
  .a-sw { width: 28px; height: 20px; border-radius: 4px; display: inline-grid; place-items: center; font-weight: 700; font-size: 11px; box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); flex-shrink: 0; }
  .list-row .a-dot { display: block; flex: 0 0 8px; width: 8px; height: 8px; min-height: 0; padding: 0; border-radius: 50%; margin: 0 10px; background: var(--fg3); }
  .list-row .a-dot.fail { background: var(--danger); } .list-row .a-dot.warn { background: #f5a623; } .list-row .a-dot.pass { background: var(--green); }
  .a-ratio { font-family: var(--mono); font-size: 10px; font-weight: 600; flex-shrink: 0; text-align: right; line-height: 14px; }
  .a-ratio.fail { color: var(--danger); } .a-ratio.pass { color: var(--green-fg); } .a-ratio small { display: block; color: var(--fg2); font-weight: 400; }
  .tok-bar { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
  .tok-bar .fill1 { flex: 1; }
  .tok-bar .dd { box-shadow: inset 0 0 0 1px var(--border); }
  .modes { grid-template-columns: auto 1fr; gap: 2px 10px; margin: 2px 0 6px; padding-left: 8px; border-left: 2px solid var(--bg2); }
  .modes .mk { color: var(--fg2); line-height: 20px; }
  .modes .mv { display: flex; align-items: center; gap: 6px; min-width: 0; line-height: 20px; }
  .modes .mv .sw { width: 12px; height: 12px; }
  .form { display: grid; gap: 6px; padding: 8px; margin: 4px 0 2px; border-radius: 6px; background: var(--bg2); }
  .form .row { display: flex; gap: 6px; justify-content: flex-end; }
  .form label { color: var(--fg2); font-size: 11px; }
  input.in, select.in { width: 100%; height: 28px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 0 8px; outline: none; }
  input.in:focus, select.in:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .form textarea { min-height: 44px; }
  .mini { color: var(--brand); cursor: pointer; font-weight: 500; }
  .mini:hover { text-decoration: underline; }
  .cc-head { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; color: var(--fg2); }
  .cc-head b { color: var(--fg); font-weight: 600; }
  .cc-head .fill1 { flex: 1; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 6px; background: var(--bg2); }
  .seg button { height: 22px; padding: 0 9px; border-radius: 4px; color: var(--fg2); font-weight: 500; }
  .seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }
  .pv-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0 8px; }
  .pv-bar .fill1 { flex: 1; }
  .pv-bar input[type=range] { width: 90px; accent-color: var(--brand); }
  .pv-bar label { display: inline-flex; align-items: center; gap: 4px; color: var(--fg2); cursor: pointer; }
  .pv-stage { border-radius: 6px; background: repeating-conic-gradient(var(--bg2) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px; box-shadow: inset 0 0 0 1px var(--border); padding: 8px; overflow: hidden; }
  .pv-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pv-col .cap { color: var(--fg2); font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .pv-box { position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); background: #fff; }
  .pv-box iframe { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: transparent; }
  .pv-box img.shot { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
  .pv-note { color: var(--fg3); margin-top: 6px; }
  .top-tabs { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  .note { margin: 4px 8px 0 0; padding: 8px 10px; background: var(--bg2); border-radius: 5px; color: var(--fg); white-space: pre-wrap; display: flex; gap: 8px; }
  .note .who { color: var(--fg2); }

  /* ---------- sections ---------- */
  .sec { border-bottom: 1px solid var(--border); padding: 4px 0 12px; }
  .sec:last-child { border-bottom: 0; }
  .sec-h { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 0 16px; }
  .sec-h .t { font-weight: 600; flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .sec-h .t .cnt { color: var(--fg2); font-weight: 400; }
  .sec-h > .btn { margin-right: 8px; }
  .sec-b { padding: 0 16px; }

  /* dropdown trigger like Figma's */
  .dd { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 4px 0 8px; border-radius: 5px; color: var(--fg); white-space: nowrap; }
  .dd:hover { background: var(--hover); }
  .dd svg { color: var(--icon); }

  /* property rows */
  .props { display: grid; grid-template-columns: minmax(76px, 38%) 1fr; row-gap: 0; align-items: center; }
  .pk { color: var(--fg2); height: 24px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .pv { min-height: 24px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pv > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp { border-radius: 4px; padding: 2px 4px; margin: 0 -4px; cursor: pointer; }
  .cp:hover { background: var(--hover); }
  .muted { color: var(--fg2); }
  .faint { color: var(--fg3); }

  /* tokens & swatches */
  .tok { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--bg2); max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tok svg { color: var(--icon); }
  .sw { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
        background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 8px 8px; }
  .sw i { position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); border-radius: 3px; }
  .color-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; }
  .color-row:hover { background: var(--hover); }
  .color-row .cn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color-row .cv { color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .color-row .cv.solo { color: var(--fg); flex: 1; }
  .sub-h { color: var(--fg2); margin: 8px 0 2px; }

  /* box model */
  .bm { margin: 4px 0 8px; font-size: 10px; font-variant-numeric: tabular-nums; text-align: center; color: var(--fg); }
  .bm .box { position: relative; border-radius: 4px; padding: 20px 28px; }
  .bm .lab { position: absolute; top: 3px; left: 6px; font-size: 9px; color: var(--fg2); }
  .bm .n { position: absolute; }
  .bm .n.t { top: 3px; left: 0; right: 0; } .bm .n.b { bottom: 3px; left: 0; right: 0; }
  .bm .n.l { left: 0; width: 28px; top: 50%; transform: translateY(-50%); } .bm .n.r { right: 0; width: 28px; top: 50%; transform: translateY(-50%); }
  .bm .n.z { color: var(--fg3); }
  .bm .pos { border: 1px dashed var(--fg3); }
  .bm .pad { background: var(--bg2); border: 1px solid var(--border); }
  .bm .core { height: 32px; display: grid; place-items: center; border-radius: 3px; border: 1px solid var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--bg)); font-weight: 500; font-size: 11px; cursor: pointer; }

  /* code */
  .code { position: relative; background: var(--bg2); border-radius: 5px; }
  .code pre { margin: 0; padding: 8px 0; font: 11px/18px var(--mono); white-space: pre; max-height: 520px; overflow: auto; tab-size: 2; color: var(--fg); counter-reset: ln; }
  .code pre .l { display: block; padding: 0 14px 0 0; min-width: max-content; }
  .code pre .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 34px; padding-right: 12px; margin-right: 4px; text-align: right; color: var(--fg3); user-select: none; position: sticky; left: 0; background: var(--bg2); }
  .code pre::-webkit-scrollbar { width: 8px; height: 8px; } .code pre::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 8px; }
  .files { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 8px; overflow-x: auto; }
  .file { height: 28px; padding: 0 10px; color: var(--fg2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; }
  .file:hover { color: var(--fg); }
  .file.on { color: var(--fg); border-bottom-color: var(--brand); }
  .fonts { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .fonts-h { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 6px; }
  .frow { padding: 6px 0; }
  .frow + .frow { border-top: 1px dashed var(--border); }
  .frow-top { display: flex; align-items: center; gap: 6px; min-height: 24px; }
  .frow-top .fill1 { flex: 1; }
  .frow-top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsrc { font-size: 10px; font-weight: 600; letter-spacing: .02em; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0; }
  .fsrc.google { color: var(--green-fg); background: var(--green-tint); }
  .fsrc.custom { color: var(--warn-fg); background: var(--warn-tint); }
  .fsrc.system { color: var(--fg2); background: var(--bg2); }
  .fnote { color: var(--fg2); margin: 2px 0 0; line-height: 1.45; }
  .fvars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .fvar { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--bg2); color: var(--fg2); font-size: 11px; }
  .fvar.ok { color: var(--green-fg); background: var(--green-tint); }
  .fvar .x { cursor: pointer; opacity: .7; margin-left: 2px; }
  .fvar .x:hover { opacity: 1; }
  .code-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .code-foot .stats { color: var(--fg2); flex: 1; min-width: 160px; }
  .warn { padding: 6px 10px; border-radius: 5px; background: color-mix(in srgb, #ffcd29 25%, transparent); margin-bottom: 8px; }
  .code .copy-float { position: absolute; top: 4px; right: 4px; opacity: 0; background: var(--bg); box-shadow: 0 0 0 1px var(--border); }
  .code:hover .copy-float { opacity: 1; }
  .code + .code { margin-top: 8px; }
  .code-label { color: var(--fg2); margin: 10px 0 4px; }
  .c-p { color: var(--code-prop); } .c-v { color: var(--code-val); } .c-s { color: var(--code-str); } .c-t { color: var(--code-tag); } .c-c { color: var(--code-cmt); }

  /* typography card */
  .type-card { display: flex; gap: 10px; align-items: center; padding: 8px; margin: 0 -8px 6px; border-radius: 5px; }
  .type-card .ag { width: 40px; height: 40px; border-radius: 5px; background: var(--bg2); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
  .type-card .tn { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .type-card .td { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg-sep { height: 1px; background: var(--border); margin: 8px 0; }

  /* component card */
  .cmp-card { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 8px; }
  .cmp-card .ci { color: var(--purple); }
  .cmp-card .cn { flex: 1; min-width: 0; }
  .cmp-card .cn b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { color: var(--brand-fg); cursor: pointer; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
  .link:hover { text-decoration: underline; }
  .desc { color: var(--fg2); margin: 0 0 8px; white-space: pre-wrap; }

  /* spacing */
  .spacing { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .sp { background: var(--bg2); border-radius: 5px; padding: 6px 8px; cursor: pointer; }
  .sp:hover { background: var(--pressed); }
  .sp b { display: block; font-size: 12px; font-weight: 600; color: #f24822; font-variant-numeric: tabular-nums; }
  .sp span { color: var(--fg2); font-size: 10px; }
  .spacing.two { grid-template-columns: 1fr 1fr; }

  /* assets */
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .asset { cursor: pointer; min-width: 0; }
  .asset .th { aspect-ratio: 1; border-radius: 5px; background: var(--bg2); display: grid; place-items: center; overflow: hidden; position: relative; border: 1px solid transparent; }
  .asset:hover .th { border-color: var(--brand); }
  .asset .th img { max-width: 76%; max-height: 76%; object-fit: contain; }
  .asset .th .dl { position: absolute; right: 4px; bottom: 4px; width: 22px; height: 22px; border-radius: 4px; background: var(--brand); color: #fff; display: grid; place-items: center; opacity: 0; }
  .asset:hover .th .dl { opacity: 1; }
  .asset .an { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asset .am { color: var(--fg2); font-size: 10px; }
  .ph { color: var(--fg3); }

  /* text content */
  .content { background: var(--bg2); border-radius: 5px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow: auto; cursor: pointer; }
  .content:hover { box-shadow: inset 0 0 0 1px var(--border); }

  /* buttons */
  .btn { height: 24px; padding: 0 8px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--border); white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.green { background: var(--green); color: #fff; box-shadow: none; }
  .btn.green:hover { filter: brightness(1.06); }
  .btn.blue { background: var(--brand); color: var(--onbrand); box-shadow: none; }
  .btn.full { width: 100%; height: 32px; }
  .row-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* empty / locked */
  .empty { padding: 32px 24px 20px; text-align: center; }
  .empty .em-ico { width: 40px; height: 40px; margin: 0 auto 12px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; color: var(--icon); }
  .empty h3 { font-size: 13px; line-height: 20px; margin: 0 0 4px; font-weight: 600; }
  .empty p { margin: 0 auto; color: var(--fg2); max-width: 240px; }
  textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; resize: vertical; min-height: 52px; outline: none; }
  textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .list-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; }
  .list-row:hover { background: var(--hover); }
  .list-row .ico { color: var(--icon); }
  .list-row .ln { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-ico.ready { color: var(--green); } .st-ico.done { color: var(--green); }

  /* menu (Figma dark menu) */
  .menu { position: fixed; z-index: 50; min-width: 180px; background: var(--menu); color: var(--menu-fg); border-radius: 13px; padding: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.15), 0 10px 16px rgba(0,0,0,.12), 0 0 .5px rgba(0,0,0,.15); display: none; }
  .menu.on { display: block; }
  .mi { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px 0 6px; border-radius: 5px; white-space: nowrap; }
  .mi:hover { background: var(--menu-hover); }
  .mi .ck { width: 16px; display: grid; place-items: center; }
  .mi.dis { opacity: .4; pointer-events: none; }
  .mh { color: var(--menu-fg2); padding: 4px 8px 2px 28px; font-size: 11px; }
  .ms { height: 1px; background: rgba(255,255,255,.12); margin: 8px -8px; }

  .toast { position: fixed; left: 50%; bottom: 12px; transform: translate(-50%, 8px); background: var(--menu); color: var(--menu-fg); padding: 8px 12px; border-radius: 5px; opacity: 0; pointer-events: none; transition: .15s; z-index: 60; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .demo { background: var(--bg2); color: var(--fg2); padding: 4px 16px; font-size: 10px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .bar { height: 2px; flex-shrink: 0; background: linear-gradient(90deg, transparent, var(--brand), transparent) 0 0 / 200% 100%; opacity: 0; }
  .bar.on { opacity: 1; animation: ld 1s linear infinite; }
  @keyframes ld { to { background-position: -200% 0; } }
  .resize { position: fixed; right: 0; bottom: 0; width: 12px; height: 12px; cursor: nwse-resize; color: var(--fg3); }
  /* ================= Dev Mode look (v3) ================= */
  :root { --code-prop: var(--fg); --code-val: #c4258f; --code-kw: #b35c00; --code-str: #2f6fdb; --code-tag: #8638e5; --code-cmt: rgba(0,0,0,.4); --pad-tint: #e5f4ff; }
  @media (prefers-color-scheme: dark) { :root:not(.figma-light) { --code-prop: var(--fg); --code-val: #ff7ac6; --code-kw: #ffa657; --code-str: #79b8ff; --code-tag: #c5a3ff; --code-cmt: rgba(255,255,255,.4); --pad-tint: rgba(13,153,255,.18); --warn-fg: var(--figma-color-text-warning, #f5a455); --warn-tint: var(--figma-color-bg-warning-tertiary, rgba(247,133,0,.16)); } }
  .figma-dark { --code-prop: var(--fg); --code-val: #ff7ac6; --code-kw: #ffa657; --code-str: #79b8ff; --code-tag: #c5a3ff; --code-cmt: rgba(255,255,255,.4); --pad-tint: rgba(13,153,255,.18); --warn-fg: var(--figma-color-text-warning, #f5a455); --warn-tint: var(--figma-color-bg-warning-tertiary, rgba(247,133,0,.16)); }
  .c-k { color: var(--code-kw); } .c-n { color: var(--code-val); }
  u.vu { text-decoration: none; border-bottom: 1px dashed #3fbf73; }

  /* header */
  .hdr { padding: 12px 8px 10px 16px; }
  .hdr-row { height: 28px; }
  .hdr .name { font-size: 13px; }
  .h-type, .h-meta { display: flex; align-items: center; gap: 6px; min-height: 28px; padding-right: 8px; color: var(--fg2); }
  .h-type .fill1, .h-meta .fill1 { flex: 1; }
  .tline { display: inline-flex; align-items: center; gap: 6px; color: var(--fg2); white-space: nowrap; }
  .tline svg { color: var(--icon); }
  .tline.cmp, .tline.cmp svg { color: var(--purple); }
  .tline.cmp[data-select] { cursor: pointer; } .tline.cmp[data-select]:hover { text-decoration: underline; }
  .h-meta svg { color: var(--icon); }
  .h-meta .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hdr .crumb { padding-left: 0; margin: 2px 0 0; }
  .hdr .note { margin: 8px 8px 2px 0; }
  .note svg { color: var(--icon); flex-shrink: 0; }
  .btn.sm { height: 24px; padding: 0 4px 0 8px; font-weight: 400; gap: 2px; }
  .btn.sm svg { color: var(--icon); }
  .btn.warn { color: var(--warn-fg); background: var(--warn-tint); box-shadow: none; }
  .btn.warn svg { color: currentColor; }
  .btn.wide { width: 100%; height: 28px; font-weight: 400; margin-top: 8px; }

  /* collapsible sections */
  .sec { padding: 0 0 14px; }

  .sec-h { padding: 0 8px 0 2px; height: 40px; }
  .sec-t { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 0; font-weight: 600; text-align: left; color: var(--fg); }
  .sec-t .chv { width: 14px; height: 16px; display: grid; place-items: center; color: var(--fg3); transition: transform .12s; flex-shrink: 0; }
  .sec.closed .sec-t .chv { transform: rotate(-90deg); }
  .sec-t .cnt { color: var(--fg2); font-weight: 400; margin-left: 6px; }
  .sec-t:hover .chv { color: var(--fg2); }
  .blk { padding: 12px 16px 14px; border-bottom: 1px solid var(--border); }

  /* instance overrides (B) */
  .ov-note { display: flex; gap: 8px; color: var(--fg2); line-height: 18px; }
  .ov-note svg { color: var(--icon); margin-top: 1px; }
  .ov-act { padding: 8px 0 0 24px; }
  .ov-act .btn { height: 28px; font-weight: 400; padding: 0 10px; }
  .ov-list { margin: 8px 0 0 16px; }
  .ov-list .list-row { height: 28px; }

  /* dev resources (C) & code connect */
  .res-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 5px; }
  .res-row:hover { background: var(--hover); }

  .res-row .ri { color: var(--fg); }

  .cc-box { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 6px; background: var(--bg2); color: var(--fg2); }
  .cc-box b { font-weight: 500; color: var(--fg); }

  .cc-box .fill1 { flex: 1; }
  .cc-box .mini { color: var(--fg2); font-weight: 400; }

  /* component information (D/E) */
  .ci-desc { margin: 0 0 10px; color: var(--fg); line-height: 18px; white-space: pre-wrap; }
  .ci-prev { height: 132px; border-radius: 6px; background: var(--bg2); display: grid; place-items: center; overflow: hidden; margin-bottom: 8px; }
  .ci-prev img { max-width: 82%; max-height: 104px; object-fit: contain; }

  .more-row { display: flex; align-items: center; gap: 8px; height: 32px; color: var(--fg); }
  .more-row svg { color: var(--icon); }

  /* annotations */
  .ann { display: flex; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 6px; background: var(--bg2); margin-bottom: 6px; }
  .ann-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .ann-b { flex: 1; min-width: 0; line-height: 17px; word-break: break-word; }
  .ann-cat { font-size: 10px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .ann-b code { font-family: var(--mono); font-size: 10.5px; background: var(--bg); padding: 0 3px; border-radius: 3px; }
  .ann-props { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .ann .x { opacity: 0; color: var(--fg2); align-self: flex-start; margin: -4px -4px 0 0; }
  .ann:hover .x { opacity: 1; }
  .ann-help { margin-top: 8px; color: var(--fg2); }
  .ann-help summary { cursor: pointer; color: var(--fg2); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
  .ann-help summary::-webkit-details-marker { display: none; }
  .ann-help summary:hover { color: var(--fg); }
  .ann-help ul { margin: 6px 0 0; padding-left: 16px; line-height: 17px; }
  .ann-help li { margin-bottom: 4px; }
  .ann-help kbd { font: 600 10px/16px Inter, sans-serif; padding: 0 4px; border-radius: 3px; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--border); color: var(--fg); }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chk { display: flex; align-items: center; gap: 6px; color: var(--fg); cursor: pointer; }
  .chk input { margin: 0; accent-color: var(--brand); }
  .chk .faint { margin-left: 2px; }

  /* box model (G) */
  .bm2 { position: relative; background: var(--bg2); border-radius: 8px; padding: 34px 44px; margin: 0 0 10px; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--fg); }
  .bm2.nom { padding: 18px 18px 30px; }
  .mline { position: absolute; background: var(--brand); }
  .mline.abs { background: #f24822; }
  .mline.t { left: 50%; top: 0; width: 1px; height: 34px; } .mline.b { left: 50%; bottom: 0; width: 1px; height: 34px; }
  .mline.l { top: 50%; left: 0; height: 1px; width: 44px; } .mline.r { top: 50%; right: 0; height: 1px; width: 44px; }
  .mtag { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--brand); color: #fff; font-weight: 500; font-size: 10px; line-height: 16px; padding: 0 4px; border-radius: 2px; min-width: 20px; text-align: center; cursor: pointer; white-space: nowrap; }
  .mline.abs .mtag { background: #f24822; }
  .bb { position: relative; background: var(--bg); border-radius: 10px; padding: 30px 34px; }
  .bb .cn { position: absolute; width: 12px; height: 12px; border: 0 solid var(--fg3); }
  .bb .cn.on { border-color: var(--fg); }
  .bb .cn.tl { left: -2px; top: -2px; border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 9px; }
  .bb .cn.tr { right: -2px; top: -2px; border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 9px; }
  .bb .cn.br { right: -2px; bottom: -2px; border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 9px; }
  .bb .cn.bl { left: -2px; bottom: -2px; border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 9px; }
  .chipn { position: absolute; min-width: 20px; height: 18px; line-height: 16px; text-align: center; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 10.5px; cursor: pointer; }
  .chipn.z, .bw.z { color: var(--fg3); cursor: default; }
  .rad.tl { left: 6px; top: 6px; } .rad.tr { right: 6px; top: 6px; } .rad.br { right: 6px; bottom: 6px; } .rad.bl { left: 6px; bottom: 6px; }
  .bb > .lab { position: absolute; left: 34px; top: 7px; color: var(--fg2); }
  .bw { position: absolute; line-height: 16px; }
  .bw.t { left: 50%; top: 7px; transform: translateX(-50%); } .bw.b { left: 50%; bottom: 7px; transform: translateX(-50%); }
  .bw.l { left: 14px; top: 50%; transform: translateY(-50%); } .bw.r { right: 14px; top: 50%; transform: translateY(-50%); }
  .pb { position: relative; background: var(--pad-tint); border: 1px solid var(--fg); border-radius: 1px; padding: 27px 38px; }
  .pb > .lab { position: absolute; left: 7px; top: 5px; color: var(--fg2); }
  .pv2.t { left: 50%; top: 4px; transform: translateX(-50%); } .pv2.b { left: 50%; bottom: 4px; transform: translateX(-50%); }
  .pv2.l { left: 8px; top: 50%; transform: translateY(-50%); } .pv2.r { right: 8px; top: 50%; transform: translateY(-50%); }
  .cb { border: 1px dashed var(--fg); background: var(--bg); height: 28px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; cursor: pointer; white-space: nowrap; }
  .bbx { position: absolute; right: 10px; bottom: 8px; color: var(--fg3); }
  .lp-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .lp-bar .seg button { height: 26px; padding: 0 10px; font-weight: 400; font-size: 11px; }
  .dd.box { box-shadow: inset 0 0 0 1px var(--border); height: 28px; padding: 0 6px 0 10px; gap: 8px; }
  .lchg { display: grid; grid-template-columns: auto; gap: 2px; padding: 12px; border-radius: 6px; background: var(--bg2); margin: 0 0 14px; line-height: 17px; }
  .lchg svg { color: var(--fg); margin-bottom: 6px; }
  .lchg b { font-weight: 600; }
  .lp-h { font-weight: 500; color: var(--fg); margin: 2px 0 6px; }
  .lp-props .pk { height: 32px; line-height: 32px; }
  .lp-props .pv { min-height: 32px; }

  /* variable chip (#) */
  .vchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--border); max-width: 100%; min-width: 0; cursor: pointer; background: var(--bg); }

  .vchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .vchip.sm { height: 20px; padding: 0 6px; cursor: default; }
  .tok { height: 24px; padding: 0 8px 0 6px; border-radius: 5px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }

  /* code groups (H) */
  .cg-h { display: flex; align-items: center; justify-content: space-between; height: 32px; margin-top: 6px; }
  .cg-h span.t { color: var(--fg); }
  .code { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); border-radius: 6px; }
  .code pre { padding: 10px 0; font: 11.5px/20px var(--mono); }
  .code pre .l::before { width: 30px; padding-right: 10px; margin-right: 12px; background: var(--bg); box-shadow: inset -1px 0 0 var(--border); color: var(--fg3); }
  .code pre::before { content: ''; }
  .code.wrap pre { white-space: pre-wrap; word-break: break-all; }

  /* colors (H) */

  .cchip .sw { width: 18px; height: 18px; }
  .cchip span.cl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ccol .cval { color: var(--fg2); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* interactions */

  .ix .pk { height: 30px; line-height: 30px; }
  .ix .pv { min-height: 30px; }

  /* assets list (I) */
  .arow { display: flex; align-items: center; gap: 14px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; position: relative; }
  .arow:hover { background: var(--hover); }
  .arow .th { width: 60px; height: 60px; border-radius: 4px; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
  .arow .th img { max-width: 80%; max-height: 80%; object-fit: contain; }

  .arow .an { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .arow .ak { display: inline-flex; align-items: center; gap: 6px; color: var(--fg2); font-size: 12px; white-space: nowrap; }
  .arow .ak.cmp { color: var(--purple); } .arow .ak.cmp svg { color: var(--purple); }
  .arow .ak[data-select]:hover { text-decoration: underline; }
  .arow .dl { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--icon); opacity: 0; }
  .arow:hover .dl { opacity: 1; }

  /* export (J) */

  if (sp.constraints) Object.keys(sp.constraints).forEach(k => { rows += prow(pretty(k.replace(/([A-Z])/g, ' $1')), px(sp.constraints[k])); });

      prow('Padding', L.padding.map(r2).join(' '), L.padding.map(v => v + 'px').join(' '), tokFor(sp, ['paddingLeft', 'paddingTop', 'paddingRight', 'paddingBottom'])) +
      prow('Gap', L.gap === 'auto' ? 'Auto' : px(L.gap), undefined, L.gap === 'auto' ? null : tokFor(sp, ['itemSpacing'])) +

      prow('Align', (ALIGN[L.primary] || L.primary) + ' · ' + (ALIGN[L.counter] || L.counter)) +

}
function cssGroups(css) {

    if (m) {
      const t = m[1] === 'Auto layout' || m[1] === 'Layout' ? 'Layout' : m[1] === 'Style' ? 'Style' : 'Typography';
      cur = out.find(g => g.title === t);
      if (!cur) { cur = { title: t, sub: t === 'Typography' && m[1] !== 'Typography' ? m[1] : '', lines: [] }; out.push(cur); }
      return;
    }
    if (!l.trim()) return;
    if (!cur) { cur = { title: 'Style', sub: '', lines: [] }; out.push(cur); }
    cur.lines.push(l.trim());

/* colors */
function cchip(color, label, copyVal, named) {
  return '<div class="ccol"><span class="cchip" data-copy="' + esc(copyVal) + '">' + sw(color) + '<span class="cl">' + esc(label) + '</span></span>' + (named ? '<span class="cval">' + esc(fmtColor(color)) + '</span>' : '') + '</div>';
}
function paintRows(list, styleName) {
  return list.map(p => {
    if (p.type === 'SOLID') {
      const name = p.variable ? (p.variable.web || p.variable.name) : styleName;
      const v = fmtColor(p.color);
      return cchip(p.color, name || v, p.variable && p.variable.web ? p.variable.web : v.split('  ')[0], !!name);
    }
    return colorRow(p, styleName);
  }).join('');
}
function secColors(sp) {
  const fills = sp.type === 'TEXT' ? [] : (sp.fills || []);
  const strokes = sp.strokes || [];
  const texts = sp.text ? sp.text.segments.filter(s => s.color) : [];
  if (!fills.length && !strokes.length && !texts.length) return '';
  const fmt = { hex: 'Hex', rgb: 'RGB', hsl: 'HSL' }[S.data.settings.colorFormat] || 'Hex';
  let b = '';
  if (fills.length) b += '<div class="ccol-h">Background colors</div>' + paintRows(fills, sp.fillStyle);
  if (texts.length) {
    const seen = {};
    b += '<div class="ccol-h">Text colors</div>' + texts.filter(s => { const k = fmtColor(s.color) + (s.colorVar ? s.colorVar.name : ''); if (seen[k]) return false; seen[k] = 1; return true; })
      .map(s => cchip(s.color, s.colorVar ? (s.colorVar.web || s.colorVar.name) : fmtColor(s.color), s.colorVar && s.colorVar.web ? s.colorVar.web : fmtColor(s.color).split('  ')[0], !!s.colorVar)).join('');

  if (strokes.length) b += '<div class="ccol-h">Border colors</div>' + paintRows(strokes, sp.strokeStyle);
  return sec('Colors', '<button class="dd box" data-act="color-menu">' + fmt + I.chevS + '</button>', b);
}

/* ===================================================================
 * Render

/* ---------- view state: a node edit must not move the page under the user ---------- */
function viewState() {
  const main = $('main');
  const out = { top: main ? main.scrollTop : 0, focus: null };
  const a = document.activeElement;
  if (!a || a === document.body || a === main) return out;
  if (a.id) out.focus = { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  else if (a.getAttribute && a.getAttribute('data-act')) {
    out.focus = { act: a.getAttribute('data-act'), key: a.getAttribute('data-key') || '', idx: a.getAttribute('data-idx') || '' };
  }
  return out;
}
function restoreView(v) {
  const main = $('main');
  if (main && v.top) main.scrollTop = v.top;
  const f = v.focus;
  // A freshly opened form owns focus; don't steal it back to the trigger.
  if (!f || S._autoFocus) return;
  let el;
  if (f.id) el = document.getElementById(f.id);
  else {
    const list = Array.from(document.querySelectorAll('#main [data-act="' + String(f.act).replace(/"/g, '') + '"]'));
    el = list.find(x => (x.getAttribute('data-key') || '') === f.key && (x.getAttribute('data-idx') || '') === f.idx) || list[0] || null;
  }
  if (!el || !el.focus) return;
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) { /* ignore */ } }
  if (typeof f.s === 'number' && el.setSelectionRange) { try { el.setSelectionRange(f.s, f.e); } catch (e) { /* not a text field */ } }
}
/** Icon-only controls need names; decorative SVGs must not be announced. */
function a11yDom() {
  document.querySelectorAll('#hdr svg, #main svg, #bar svg, #menu svg').forEach(s => { s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false'); });
  document.querySelectorAll('button.ibtn[title], a.ibtn[title]').forEach(b => { if (!b.getAttribute('aria-label')) b.setAttribute('aria-label', b.getAttribute('title')); });
  document.querySelectorAll('#main .sec-t').forEach(b => { const sec = b.closest('.sec'); if (sec) b.setAttribute('aria-expanded', String(!sec.classList.contains('closed'))); });
  document.querySelectorAll('#main .sec').forEach(sec => { if (!sec.getAttribute('aria-label')) { const t = sec.querySelector('.sec-t'); if (t) sec.setAttribute('aria-label', t.textContent.trim()); } });
}
/* Inside Figma a silent plugin thread is a fault, not a preview. Showing another

   Sample data is now an explicit choice, and only offered outside Figma. */
function renderDisconnected() {
  const host = (window.parent && window.parent !== window) ? 'the plugin thread' : 'the page';
  $('hdr').innerHTML = '<div class="hdr-row"><div class="name">DevReady</div></div>' +
    '<div class="h-type"><span class="faint">Not connected</span></div>';
  $('main').innerHTML = '<div class="offline"><b>No answer from ' + esc(host) + '</b>' +
    '<span class="faint">The panel opened but nothing replied within 1.5 s, so there is no design data to show. ' +
    'Reopen the plugin (Plugins → Development), then retry. If it keeps happening, close the plugin window and run it again — ' +
    'a plugin error toast from Figma explains the cause.</span></div>' +
    '<div class="row-btns" style="margin-top:10px">' +
    '<button class="btn blue" data-act="retry-connect">Retry</button>' +
    (window.parent === window ? '<button class="btn" data-act="use-samples">Show sample data</button>' : '') +
    '</div>' +
    '<div class="faint" style="margin-top:10px">Nothing you typed has been sent anywhere. The panel does not show another ' +
    'design while it is disconnected, so nothing you see here can be mistaken for your file.</div>';
}
function retryConnect() {
  S.disconnected = false; S.got = false;
  send({ type: 'ui-ready' });
  send({ type: 'store-get', key: 'projects' });
  send({ type: 'store-get', key: 'history' });
  send({ type: 'plan' });
  render();
  setTimeout(() => {
    if (S.got) { toast('Connected'); return; }
    S.disconnected = true; render();
    toast('Still no answer from Figma — reopen the plugin');
  }, 2000);
}
function useSamples() {
  S.disconnected = false; S.demo = true;
  S.data = JSON.parse(JSON.stringify(DEMO));
  Object.keys(DEMO_THUMBS).forEach(k => { S.thumbs[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(DEMO_THUMBS[k]); });
  render();
}
function render() {
  const v = viewState();
  S._autoFocus = false;
  try { renderNow(); } finally { a11yDom(); restoreView(v); S._autoFocus = false; }
}
function renderNow() {
  $('demo').style.display = S.demo ? 'block' : 'none';
  renderTabs();
  const d = S.data;
  const main = $('main');
  const tabby = !!(S.tab && S.tab !== 'design');
  if (main && main.classList) { if (tabby) main.classList.add('tabview'); else main.classList.remove('tabview'); }
  if (S.disconnected) return renderDisconnected();
  // The workspace tabs own the panel; Design is the original inspector.
  if (tabby) return renderTabView(d);
  if (!d) { $('hdr').innerHTML = '<div class="hdr-row"><div class="name">DevReady</div></div>'; $('main').innerHTML = ''; return; }
  if (d.mode === 'empty') return renderEmpty(d);
  if (d.mode === 'locked') return renderLocked(d);
  return renderInspect(d);
}

  return '<' + tag + ' class="chip ready">' + I.ready + 'Ready for dev' + end;

function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }

function wsEnsure() {

/**

/** Duplicate names are confusing in the switcher, so make them unique instead. */
function uniqueName(w, base) {
  const taken = n => w.projects.some(x => x.name === n && !x.archived);

  while (taken(base + ' ' + n)) n++;

/* ---------- local revision history ---------- */
function histEnsure() { S.hist = S.hist || { list: [] }; if (!Array.isArray(S.hist.list)) S.hist.list = []; return S.hist; }
function hashText(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = (h * 16777619) >>> 0; } return h.toString(36); }
function histPush(lang, files) {
  if (!files || !files.length) return;
  const h = histEnsure();
  const p = wsActive();
  const code = {};
  let total = 0;
  const meta = files.map(f => {
    const size = f.code.length;
    total += size;
    if (total <= 120000) code[f.name] = f.code;
    return { name: f.name, size: size, hash: hashText(f.code) };
  });
  const rev = { id: newId('r'), at: Date.now(), project: p.id, lang: lang, nodeName: (S.data && S.data.spec && S.data.spec.name) || '', label: lang + ' · ' + files.length + ' file' + (files.length === 1 ? '' : 's'), files: meta, code: total <= 120000 ? code : undefined, full: total > 120000 };
  h.list.unshift(rev);
  h.list = h.list.slice(0, 8);
  p.revisions = (p.revisions || []).concat([{ id: rev.id, at: rev.at, label: rev.label, lang: rev.lang, nodeName: rev.nodeName, files: meta, code: rev.code }]).slice(-10);
  p.updated = Date.now();
  send({ type: 'store-set', key: 'history', value: JSON.stringify({ list: h.list }) });
  wsSave();
}
function histFile(r, name) { return r && r.code ? r.code[name] : null; }
/** Line diff for the compare view: common prefix/suffix, then the changed block. */
function lineDiff(before, after) {
  const a = String(before || '').split('\n'), b = String(after || '').split('\n');
  let start = 0;
  while (start < a.length && start < b.length && a[start] === b[start]) start++;
  let endA = a.length - 1, endB = b.length - 1;
  while (endA >= start && endB >= start && a[endA] === b[endB]) { endA--; endB--; }
  return { removed: a.slice(start, endA + 1), added: b.slice(start, endB + 1), at: start };
}
function histCompare(baseId, headId) {
  const h = histEnsure();
  const a = h.list.filter(r => r.id === baseId)[0], b = h.list.filter(r => r.id === headId)[0];
  if (!a || !b) return [];
  const names = {};
  (a.files || []).forEach(f => { names[f.name] = 1; });
  (b.files || []).forEach(f => { names[f.name] = 1; });
  return Object.keys(names).sort().map(name => {
    const fa = (a.files || []).filter(f => f.name === name)[0], fb = (b.files || []).filter(f => f.name === name)[0];
    if (!fa) return { name: name, kind: 'added' };
    if (!fb) return { name: name, kind: 'removed' };
    if (fa.hash === fb.hash) return { name: name, kind: 'unchanged' };
    const d = lineDiff(histFile(a, name), histFile(b, name));
    return { name: name, kind: 'changed', diff: d };
  });
}

/* ---------- Design Files ---------- */
/**
 * The processing queue. One file at a time, so a heavy frame cannot starve the
 * panel, and each entry keeps its own status: a failure stays visible and can be
 * retried without re-running the files that already succeeded.
 */
function wsFileEntry(p, id) { return ((p && p.files) || []).filter(f => f.id === id)[0] || null; }
function filesPending(onlyFailed) {
  const p = wsActive();
  return (p.files || []).filter(f => (onlyFailed ? f.status === 'error' : f.status !== 'ok') && f.status !== 'running');
}
function filesRun(onlyFailed) {
  const p = wsActive();
  const list = filesPending(onlyFailed);
  if (!list.length) { toast(onlyFailed ? 'Nothing failed — everything is generated' : 'Everything in this project is already generated'); return; }
  if (S.run.active) { toast('A run is already in progress'); return; }
  S.run.queue = list.map(f => f.id);
  S.run.done = 0;
  S.run.total = S.run.queue.length;
  S.run.cancelled = false;
  S.run.lastError = '';
  activate('Queued ' + S.run.total + ' file' + (S.run.total === 1 ? '' : 's') + ' in ' + p.name);
  filesNext();
}
function filesRunOne(id) {
  const f = wsFileEntry(wsActive(), id);
  if (!f) return;
  if (f.status === 'running') { toast('That file is running'); return; }
  if (S.run.active) { toast('A run is already in progress'); return; }
  S.run.queue = [id]; S.run.done = 0; S.run.total = 1; S.run.cancelled = false;
  filesNext();
}
function filesNext() {
  const p = wsActive();
  if (S.run.cancelled || !S.run.queue.length) {
    const failed = (p.files || []).filter(f => f.status === 'error').length;
    S.run.active = null;
    if (S.run.cancelled) activate('Cancelled the run after ' + S.run.done + ' of ' + S.run.total);
    else activate('Generated ' + S.run.done + ' of ' + S.run.total + ' file' + (S.run.total === 1 ? '' : 's') + (failed ? ' · ' + failed + ' failed' : ''));
    wsSave(); render();
    return;
  }
  const id = S.run.queue.shift();
  const f = wsFileEntry(p, id);
  if (!f) return filesNext();
  const jobId = ++S.run.seq + 100000;
  S.run.active = { fileId: id, jobId: jobId, requestId: 'r' + jobId, nodeId: f.nodeId };
  f.status = 'running'; f.error = '';
  render();
  send({ type: 'gen-code', lang: S.run.lang, nodeId: f.nodeId, requestId: S.run.active.requestId, jobId: jobId });
}
/** A request that fails before the engine answers: without this the queue entry
 *  stays "running" and every later run is refused with "a run is in progress". */
function filesFail(message) {
  const a = S.run.active;
  if (!a) return false;
  const f = wsFileEntry(wsActive(), a.fileId);
  if (f) { f.status = 'error'; f.error = String(message || 'The request was rejected').slice(0, 200); }
  S.run.lastError = String(message || '').slice(0, 200);
  S.run.active = null;
  S.run.queue = [];
  wsSave();
  return true;
}
function filesCancel() {
  if (!S.run.active) { toast('No run in progress'); return; }
  S.run.cancelled = true;
  send({ type: 'cancel', jobId: S.run.active.jobId });
}
/** Resolve a queue reply. Returns true when the message belonged to the queue. */
function filesSettle(m) {
  const a = S.run.active;
  if (!a || !m.jobId || m.jobId !== a.jobId) return false;
  const p = wsActive();
  const f = wsFileEntry(p, a.fileId);
  const out = m.out || {};
  if (f) {
    if (m.cancelled) { f.status = 'idle'; }
    else if (out.error) { f.status = 'error'; f.error = String(out.error).slice(0, 200); }
    else if (out.files && out.files.length) {
      f.status = 'ok'; f.at = Date.now(); f.count = out.files.length; f.lang = m.lang;
      f.rev = null;
    } else { f.status = 'error'; f.error = 'No files were produced'; }
    f.files = f.status === 'ok' ? out.files.map(x => ({ name: x.name, size: (x.code || '').length })) : [];
    if (f.status === 'ok') {
      S.run.done++;
      lastCodeFrom(m.lang, m.nodeId, f, out);
      try { histPush(m.lang, out.files); } catch (e) { diagUi('history'); }
      activate('Generated ' + f.name + ' (' + out.files.length + ' files)');
    } else if (f.status === 'error') {
      S.run.lastError = f.error;
      activate('Failed on ' + f.name);
    }
  }
  S.run.active = null;
  wsSave();
  filesNext();
  return true;
}

function codeDownload(name) {

/* ---------- GitHub ---------- */
function ghConnected() { return !!(S.gh.status && S.gh.status.connected); }
/* Every GitHub request must land somewhere. A dropped reply used to leave

   the panel disabled the buttons that could have retried. */
const GH_TIMEOUT_MS = 12000;
let ghTimer = null;
function ghSettle() {
  if (ghTimer) { clearTimeout(ghTimer); ghTimer = null; }
  S.gh.timeout = '';
  S.gh.busy = '';

}
function ghAsk(type, extra, label) {
  if (ghTimer) clearTimeout(ghTimer);
  const what = label || type.replace(/^gh-/, '');
  send(Object.assign({ type: type }, extra || {}));
  ghTimer = setTimeout(() => {
    ghTimer = null;
    S.gh.busy = ''; S.gh.pending = false;
    S.gh.timeout = what;
    if (S.tab === 'github' || S.tab === 'settings') render();
  }, GH_TIMEOUT_MS);
}

  if (!err) return '';

    auth: 'Create a new token, then Disconnect and connect again.',
    permission: 'The token needs Contents: read and write, and Administration: write to create repositories.',
    'rate-limit': 'Wait for the reset time shown, then try again.',
    conflict: 'Preview the repository again to see the current files before pushing.',
    network: 'Check your connection. Nothing was changed on GitHub.',
    'no-changes': 'The selected files already match the repository. Nothing was sent.',
  };
  return '<div class="warn" style="margin:6px 0">' + I.info + '<b>' + esc(err.code || 'error') + '</b> — ' + esc(err.message || '') +
    (tips[err.code] ? '<br><span class="faint">' + esc(tips[err.code]) + '</span>' : '') + '</div>';
}
function ghLocalFiles() {
  const lc = S.lastCode;
  if (lc && lc.files && lc.files.length) {
    const files = lc.files.filter(f => f.code !== null && f.code !== undefined).map(f => ({ path: f.name, content: f.code }));
    if (files.length) return files;
  }
  const h = histEnsure();
  const p = wsActive();
  const rev = (p.revisions || []).slice(-1)[0] || h.list[0];
  if (rev && rev.code) return Object.keys(rev.code).map(n => ({ path: n, content: rev.code[n] }));
  const c = S.code && S.code[S.lang];
  if (c && c.files) return c.files.map(f => ({ path: f.name, content: f.code }));
  return [];
}
/** Status labels for the preview, using the hashes the plugin computed. */

function ghPreviewRows() {
  const g = S.gh;

  const tree = g.tree && g.tree.repo === g.repo && g.tree.branch === g.branch ? g.tree : null;

  (tree.local || []).forEach(x => { status[x.path] = x.status; });
  const rows = files.map(f => ({ path: f.path, content: f.content, status: status[f.path] || 'unknown' }));
  (tree.deleted || []).forEach(x => rows.push({ path: x.path, content: '', status: 'deleted', del: true }));
  return { rows: rows, compared: true, empty: !!tree.empty };
}

/* ---------- dispatch ---------- */
function renderTabView(d) {

  if (S.tab === 'files') return viewFiles(d);
  if (S.tab === 'code') return viewCode(d);
  if (S.tab === 'assets') return viewAssets(d);
  if (S.tab === 'history') return viewHistory(d);
  if (S.tab === 'github') return viewGithub(d);

/** Actions owned by the workspace. Returns true when handled. */
function appAction(act, el) {
  if (act === 'tab') { setTab(el.getAttribute('data-tab')); return true; }
  if (act === 'proj-menu') { menuFor('proj-menu', el); return true; }
  if (act === 'proj-new') { wsNewProject(); return true; }
  if (act === 'proj-create') { wsCreateNamed(($('proj-name') || {}).value || (S.projForm && S.projForm.name)); return true; }
  if (act === 'proj-save') { wsRenameTo(($('proj-name') || {}).value || (S.projForm && S.projForm.name)); return true; }
  if (act === 'proj-form-cancel') { S.projForm = null; render(); return true; }
  if (act === 'proj-rename') { wsRename(); return true; }
  if (act === 'proj-dup') { wsDuplicate(); return true; }
  if (act === 'proj-del') { wsDelete(); return true; }
  if (act === 'proj-archive') { wsArchive(); return true; }
  if (act === 'proj-switch') { wsSwitch(el.getAttribute('data-id')); return true; }
  if (act === 'proj-sort') { S.projView.sort = el.getAttribute('data-sort'); render(); return true; }
  if (act === 'proj-archived') { S.projView.archived = !S.projView.archived; render(); return true; }
  if (act === 'proj-add-file') { wsAddFile(); return true; }
  if (act === 'files-add') { wsAddFile(); return true; }
  if (act === 'files-run-all') { filesRun(false); return true; }
  if (act === 'files-retry') { filesRun(true); return true; }
  if (act === 'files-cancel') { filesCancel(); return true; }
  if (act === 'files-run') { filesRunOne(el.getAttribute('data-id')); return true; }
  if (act === 'files-rm') { wsRemoveFile(el.getAttribute('data-id')); return true; }
  if (act === 'files-lang') { S.run.lang = el.getAttribute('data-lang'); render(); return true; }
  if (act === 'code-dl') { codeDownload(el.getAttribute('data-name')); return true; }
  if (act === 'code-dl-all') { codeDownloadAll(); return true; }
  if (act === 'code-open-files') { setTab('files'); return true; }
  if (act === 'code-push') {
    const lc = S.lastCode;
    if (!lc || !lc.files || !lc.files.length) { toast('Generate code first'); return true; }
    S.gh.msg = 'Update from DevReady · ' + (lc.nodeName || 'design');
    setTab('github');
    return true;
  }
  if (act === 'proj-rm-file') { wsRemoveFile(el.getAttribute('data-id')); return true; }
  if (act === 'assets-all') { S.assetsView.all = !S.assetsView.all; render(); return true; }
  if (act === 'assets-kind') { S.assetsView.kind = el.getAttribute('data-kind'); render(); return true; }
  if (act === 'assets-export-all') {
    if (S.demo) { toast('Export works inside Figma'); return true; }
    const items = filteredAssets().map(a => ({ id: a.id, format: a.kind === 'illustration' || a.kind === 'icon' ? 'SVG' : 'PNG', scale: 2 }));
    if (!items.length) { toast('No assets to export'); return true; }
    send({ type: 'export-all', items: items, zipName: 'assets.zip' });
    toast('Exporting ' + items.length + ' assets…');
    return true;
  }
  if (act === 'hist-cmp') { S.hist.cmp = S.hist.cmp === el.getAttribute('data-id') ? null : el.getAttribute('data-id'); render(); return true; }
  if (act === 'hist-restore') { histRestore(el.getAttribute('data-id')); return true; }
  if (act === 'gh-retry') {
    S.gh.timeout = ''; S.gh.status = undefined; S.gh.error = null;
    S.gh.busy = 'status'; render();
    ghAsk('gh-status', null, 'the connection check');
    return true;
  }
  if (act === 'gh-connect') {
    const f = $('gh-token');
    const token = f ? f.value.trim() : '';
    if (!/^[A-Za-z0-9_]{20,255}$/.test(token)) { toast('Paste a GitHub token (ghp_… or github_pat_…)'); return true; }
    S.gh.busy = 'connect'; S.gh.error = null; S.gh.timeout = ''; render();
    ghAsk('gh-connect', { token: token }, 'the token check');
    return true;
  }
  if (act === 'gh-disconnect') { S.gh.busy = 'disconnect'; ghAsk('gh-disconnect', null, 'disconnecting'); return true; }
  if (act === 'gh-repos') { S.gh.busy = 'repos'; S.gh.error = null; S.gh.timeout = ''; render(); ghAsk('gh-repos', null, 'the repository list'); return true; }
  if (act === 'gh-repos-all') { S.gh.reposAll = !S.gh.reposAll; render(); return true; }
  if (act === 'gh-pick') {
    S.gh.repo = el.getAttribute('data-repo'); S.gh.branches = []; S.gh.branch = ''; S.gh.tree = null; S.gh.result = null; S.gh.files = {};
    S.gh.busy = 'branches'; render();
    ghAsk('gh-branches', { repo: S.gh.repo }, 'the branch list');
    return true;
  }
  if (act === 'gh-branches') { if (!S.gh.repo) return true; S.gh.busy = 'branches'; render(); ghAsk('gh-branches', { repo: S.gh.repo }, 'the branch list'); return true; }
  if (act === 'gh-branch') { S.gh.branch = el.getAttribute('data-branch'); S.gh.tree = null; render(); return true; }
  if (act === 'gh-create') {
    const name = ($('gh-new-name') || {}).value || '';
    if (!/^[A-Za-z0-9._-]{1,100}$/.test(name.trim())) { toast('Use letters, numbers, dot, dash or underscore'); return true; }
    S.gh.busy = 'create'; render();
    send({ type: 'gh-create-repo', name: name.trim(), private: !!(($('gh-new-private') || {}).checked), description: ($('gh-new-desc') || {}).value || '' });
    return true;
  }
  if (act === 'gh-preview') {
    if (!S.gh.repo) { toast('Pick a repository first'); return true; }
    const nb = $('gh-branch-new');
    if (nb && nb.value.trim()) S.gh.branch = nb.value.trim();
    if (!S.gh.branch) { toast('Pick a branch first'); return true; }
    // Send the files so the plugin can compare git blob hashes: that is what makes
    // "modified" different from "unchanged", and it keeps identical content out of
    // the commit. Above 1.5 MB the comparison is skipped and paths are shown instead.
    const files = ghLocalFiles();
    let bytes = 0;
    files.forEach(f => { bytes += String(f.content || '').length; });
    const payload = bytes <= 1500000 ? files.slice(0, 200) : undefined;
    S.gh.busy = 'tree'; S.gh.compared = !!payload; render();
    ghAsk('gh-tree', { repo: S.gh.repo, branch: S.gh.branch, files: payload }, 'the change preview');
    return true;
  }
  if (act === 'gh-push') {
    const rows = ghPreviewRows().rows.filter(f => S.gh.files[f.path] !== false);
    const files = rows.filter(f => f.status !== 'unchanged');
    if (!rows.length) { toast('Select at least one file'); return true; }
    if (!files.length) { toast('Those files already match the repository — nothing to push'); return true; }
    const msg = ($('gh-msg') || {}).value || S.gh.msg || 'Update from DevReady';
    S.gh.msg = msg;
    S.gh.busy = 'push'; S.gh.error = null; S.gh.result = null; render();
    send({
      type: 'gh-commit', repo: S.gh.repo, branch: S.gh.branch, message: msg.slice(0, 500),
      baseSha: (S.gh.tree && S.gh.tree.headSha) || '', createBranch: !(S.gh.branches || []).some(b => b.name === S.gh.branch),
      files: files.map(f => (f.del ? { path: f.path, content: '', del: true } : { path: f.path, content: f.content }))
    });
    return true;
  }
  if (act === 'data-clear') {
    if (S.confirm !== 'clear-data') { S.confirm = 'clear-data'; render(); toast('Press again to clear projects and revisions'); return true; }
    S.confirm = null; S.ws = null; S.hist = { list: [], open: null, cmp: null };
    send({ type: 'store-set', key: 'projects', value: '{"projects":[],"active":""}' });
    send({ type: 'store-set', key: 'history', value: '{"list":[]}' });
    wsEnsure(); render(); toast('Local data cleared');
    return true;
  }
  return false;
}

/* ---------- workspace events ---------- */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t || !t.closest || !t.closest('#tabs')) return;
  const i = TABS.findIndex(x => x.id === S.tab);
  let n = -1;
  if (e.key === 'ArrowRight') n = (i + 1) % TABS.length;
  else if (e.key === 'ArrowLeft') n = (i - 1 + TABS.length) % TABS.length;
  else if (e.key === 'Home') n = 0;
  else if (e.key === 'End') n = TABS.length - 1;
  if (n < 0) return;
  e.preventDefault();
  setTab(TABS[n].id);
  const btn = $('tab-' + TABS[n].id);
  if (btn) btn.focus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'assets-q') {
    S.assetsView.q = t.value;
    const box = document.querySelector('#main');
    if (box) { const pos = t.selectionStart; render(); const el = $('assets-q'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } }
  } else if (t.id === 'gh-repo-q') { S.gh.q = t.value; render(); const el = $('gh-repo-q'); if (el) el.focus(); }
  else if (t.id === 'gh-msg') { S.gh.msg = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t || !t.id) return;
  const map = { 'set-gate': 'gate', 'set-unit': 'unit', 'set-base': 'remBase', 'set-color': 'colorFormat', 'set-fonts': 'previewFonts', 'set-svg': 'svgFrames' };
  const key = map[t.id];
  if (key) {
    const v = key === 'remBase' ? +t.value : t.value;
    setSetting({ [key]: v });
    return;
  }
  if (t.id === 'proj-name') { if (S.projForm) S.projForm.name = t.value; return; }
  if (t.id === 'proj-q') { S.projView.q = t.value; const v2 = viewState(); renderNow(); restoreView(v2); return; }
  if (t.getAttribute('data-act') === 'gh-toggle-file') {
    S.gh.files[t.getAttribute('data-path')] = t.checked;
    render();
  }
});

window.onmessage = ev => {
